name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: cargo build --release --bins
      - run: python tools/stage_binaries.py
      - run: pip install -e '.[dev]'
      - run: pytest -q

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage native binaries
        if: runner.os != 'Linux'
        run: |
          cargo build --profile dist --bins
          python tools/stage_binaries.py dist
      - uses: PyO3/maturin-action@v1
        with:
          args: --profile dist --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13
          manylinux: auto
          before-script-linux: cargo build --profile dist --bins && python3.10 tools/stage_binaries.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  cli:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --profile dist --bins
      - run: cargo test --profile dist compiled::tests::standalone_executable_story -- --ignored
      - name: Package Unix CLIs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package dist
          cp target/dist/fastforest-fit target/dist/fastforest-predict target/dist/fastforest-compile target/dist/fastforest-convert target/dist/viewcsv package/
          cp LICENSE README.md package/
          tar -czf "dist/fastforest-cli-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C package .
      - name: Package Windows CLIs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package,dist
          Copy-Item target/dist/fastforest-fit.exe,target/dist/fastforest-predict.exe,target/dist/fastforest-compile.exe,target/dist/fastforest-convert.exe,target/dist/viewcsv.exe package/
          Copy-Item LICENSE,README.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/fastforest-cli-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            release/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
