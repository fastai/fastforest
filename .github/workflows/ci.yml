name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/.github/actions/setup-uv@main
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install --system --config-settings-package fastforest:metadata-only=1 -e '.[test]'
      - run: cargo develop
      - run: pytest -q

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/.github/actions/setup-uv@main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: AnswerDotAI/.github/actions/maturin-build@main
        with:
          command: setup
          zig: ${{ runner.os == 'Linux' }}
      - name: Stage native binaries
        run: |
          uv pip install --system 'fastws-cli>=0.0.42'
          cargo stage --profile dist ${{ runner.os == 'Linux' && '--zig --manylinux 2_31' || '' }}
      - uses: AnswerDotAI/.github/actions/maturin-build@main
        with:
          args: --profile dist --out dist ${{ runner.os == 'Linux' && '--zig' || '' }}
          manylinux: '2_31'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - run: cargo test --release -p fastforest
      - run: cargo build -p fastforest --profile dist --bins
      - run: cargo test -p fastforest --profile dist compiled::tests::standalone_executable_story -- --ignored
      - name: Package Unix CLIs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package dist
          cp target/dist/fastforest-fit target/dist/fastforest-predict target/dist/fastforest-compile target/dist/fastforest-convert target/dist/viewcsv package/
          cp LICENSE README.md package/
          tar -czf "dist/fastforest-cli-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C package .
      - name: Package Windows CLIs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package,dist
          Copy-Item target/dist/fastforest-fit.exe,target/dist/fastforest-predict.exe,target/dist/fastforest-compile.exe,target/dist/fastforest-convert.exe,target/dist/viewcsv.exe package/
          Copy-Item LICENSE,README.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/fastforest-cli-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, cli]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            release/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
