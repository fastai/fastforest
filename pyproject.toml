[build-system]
requires = ["maturin>=1.9.2,<2.0", "fastws-cli>=0.0.20"]
build-backend = "fastws.build_backend"

[project]
name = "fastforest"
dynamic = ["version"]
description = "Fast approximate-forest models in Rust with Python bindings"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["numpy>=2.0", "pyarrow>=18"]

[project.optional-dependencies]
sklearn = ["pandas", "scikit-learn>=1.7.2"]
dev = ["fastws-cli>=0.0.20", "fastcore", "fastship>=0.0.11", "matplotlib", "maturin>=1.0,<2.0", "nbdev>=3.3.13", "pandas", "pytest", "scikit-learn>=1.7.2"]

[project.urls]
Homepage = "https://github.com/fastai/fastforest"
Repository = "https://github.com/fastai/fastforest"
Issues = "https://github.com/fastai/fastforest/issues"

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "fastforest._core"
data = "target/wheel-data"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "py/Cargo.toml" }]

[tool.fastws]
native-binaries = true

[tool.nbdev]
lib_path = "python/fastforest"
put_version_in_init = false

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
