[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.5"
edition = "2024"

[workspace.dependencies]
arrow-array = ">=59.2.0"
ndarray = ">=0.17.2"

[package]
name = "fastforest"
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license = "Apache-2.0"
description = "Fast approximate-forest models in Rust with Python bindings"

[lib]
name = "fastforest"
doctest = false
test = false

[[bin]]
name = "fastforest-compile"
path = "src/bin/fastforest-compile.rs"
test = false

[[bin]]
name = "fastforest-fit"
path = "src/bin/fastforest-fit.rs"
test = false

[[bin]]
name = "fastforest-predict"
path = "src/bin/fastforest-predict.rs"
test = false

[[bin]]
name = "fastforest-convert"
path = "src/bin/fastforest-convert.rs"
test = false

[[bin]]
name = "viewcsv"
path = "src/bin/viewcsv.rs"
test = false

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16
debug = true

[profile.release.package.fastforest]
incremental = true

[profile.release.package.fastforest-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
debug = false
strip = true

[profile.dist.package.fastforest]
incremental = false

[profile.dist.package.fastforest-py]
incremental = false

[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.debugging]
inherits = "dev"
opt-level = 0
debug-assertions = true
overflow-checks = true

[dependencies]
arrow-array.workspace = true
arrow-cast = ">=59.2.0"
arrow-ipc = ">=59.2.0"
arrow-select = ">=59.2.0"
arrow-schema = ">=59.2.0"
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = ">=0.4.45", default-features = false, features = ["std"] }
clap = { version = ">=4.6.6", features = ["derive"] }
csv = ">=1.4.0"
ndarray.workspace = true
rand = ">=0.10.2"
rayon = ">=1.12.0"
serde = { version = ">=1.0.228", features = ["derive"] }
tempfile = ">=3.26.0"
