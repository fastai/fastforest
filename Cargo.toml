[package]
name = "fastforest"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Fast approximate-forest models in Rust with Python bindings"

[lib]
name = "fastforest"
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "fastforest-compile"
path = "src/bin/fastforest-compile.rs"
test = false

[[bin]]
name = "fastforest-fit"
path = "src/bin/fastforest-fit.rs"
test = false

[[bin]]
name = "fastforest-predict"
path = "src/bin/fastforest-predict.rs"
test = false

[[bin]]
name = "fastforest-convert"
path = "src/bin/fastforest-convert.rs"
test = false

[[bin]]
name = "viewcsv"
path = "src/bin/viewcsv.rs"
test = false

[profile.release]
lto = true
codegen-units = 1

[dependencies]
arrow-array = ">=59.2.0"
arrow-cast = ">=59.2.0"
arrow-ipc = ">=59.2.0"
arrow-pyarrow = { version = ">=59.2.0", optional = true }
arrow-select = ">=59.2.0"
arrow-schema = ">=59.2.0"
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = ">=0.4.45", default-features = false, features = ["std"] }
clap = { version = ">=4.6.6", features = ["derive"] }
csv = ">=1.4.0"
ndarray = ">=0.17.2"
numpy = { version = ">=0.29.0", optional = true }
pyo3 = { version = ">=0.29.2", optional = true }
rand = ">=0.10.2"
rayon = ">=1.12.0"
serde = { version = ">=1.0.228", features = ["derive"] }
tempfile = ">=3.26.0"

[features]
python = ["dep:arrow-pyarrow", "dep:numpy", "dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
