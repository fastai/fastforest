[package]
name = "fastforest"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Fast approximate random forests in Rust with Python bindings"

[lib]
name = "fastforest"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
ndarray = ">=0.17.2"
numpy = { version = ">=0.29.0", optional = true }
pyo3 = { version = ">=0.29.2", optional = true }
rand = ">=0.10.2"
rayon = ">=1.12.0"

[features]
python = ["dep:numpy", "dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
